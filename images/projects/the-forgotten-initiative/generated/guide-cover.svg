<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="cast" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000000" flood-opacity="0.30"/>
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <filter id="castsm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <linearGradient id="gutter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="42%" stop-color="#000" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#000" stop-opacity="0.26"/>
      <stop offset="58%" stop-color="#000" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
<rect width="1200" height="1500" fill="#e2dbcd"/>
<g transform="rotate(-2.2 600.0 760.0)" filter="url(#cast)">
<rect x="250" y="290" width="700" height="940" rx="5" fill="#fdb414"/>
<rect x="250" y="290" width="26" height="940" fill="#000" opacity="0.14"/>
<rect x="276" y="290" width="6" height="940" fill="#fff" opacity="0.22"/>
<circle cx="614.0" cy="620" r="215" fill="#cae4db" opacity="0.5"/>

  <g opacity="1.0">
    <clipPath id="cg9"><rect x="517.40" y="594.80" width="193.20" height="50.40"/></clipPath>
    <clipPath id="cm9"><rect x="588.80" y="523.40" width="50.40" height="193.20"/></clipPath>
    <clipPath id="cc9"><rect x="588.80" y="594.80" width="50.40" height="50.40"/></clipPath>
    <rect x="517.40" y="594.80" width="193.20" height="50.40" fill="#fdb414"/>
    <rect x="588.80" y="523.40" width="50.40" height="193.20" fill="#cae4db"/>
    <rect x="588.80" y="594.80" width="50.40" height="50.40" fill="#c8a111"/>
    <rect x="517.40" y="594.80" width="193.20" height="50.40" transform="rotate(-45 614.00 620.00)" fill="#d1c7bb"/>
    <g clip-path="url(#cg9)"><rect x="517.40" y="594.80" width="193.20" height="50.40" transform="rotate(-45 614.00 620.00)" fill="#b28d35"/></g>
    <g clip-path="url(#cm9)"><rect x="517.40" y="594.80" width="193.20" height="50.40" transform="rotate(-45 614.00 620.00)" fill="#aab9a8"/></g>
    <g clip-path="url(#cc9)"><rect x="517.40" y="594.80" width="193.20" height="50.40" transform="rotate(-45 614.00 620.00)" fill="#a47e0c"/></g>
  </g>
<text x="338" y="980" font-size="78" font-weight="700" letter-spacing="-2.5" fill="#063042" text-anchor="start">Foster Care</text>
<text x="338" y="1062" font-size="78" font-weight="700" letter-spacing="-2.5" fill="#063042" text-anchor="start">&amp; The Church</text>
<rect x="338" y="1102" width="130" height="5" fill="#063042" opacity="0.55"/>
<text x="338" y="1168" font-size="19" font-weight="400" letter-spacing="5.7" fill="#063042" text-anchor="start" font-family="Space Mono, ui-monospace, SFMono-Regular, Menlo, monospace">PARTICIPANT GUIDE</text>
<rect x="250" y="290" width="700" height="940" rx="5" fill="url(#sheen)"/>
</g>
</svg>
