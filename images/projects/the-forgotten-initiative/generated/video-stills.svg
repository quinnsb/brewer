<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1200" width="1700" height="1200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="cast" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000000" flood-opacity="0.30"/>
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <filter id="castsm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <linearGradient id="gutter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="42%" stop-color="#000" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#000" stop-opacity="0.26"/>
      <stop offset="58%" stop-color="#000" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
<rect width="1700" height="1200" fill="#063042"/>
<text x="90" y="108" font-size="19" font-weight="400" letter-spacing="5.7" fill="#cae4db" text-anchor="start" font-family="Space Mono, ui-monospace, SFMono-Regular, Menlo, monospace">FOUR-PART VIDEO SERIES</text>
<g filter="url(#castsm)">
<rect x="90" y="170" width="740" height="430" rx="6" fill="#041f2c"/>
<circle cx="682.0" cy="316.20000000000005" r="118" fill="#cae4db" opacity="0.20"/>
<text x="134" y="242" font-size="17" font-weight="400" letter-spacing="5.1" fill="#fdb414" text-anchor="start" font-family="Space Mono, ui-monospace, SFMono-Regular, Menlo, monospace">PART 01</text>
<text x="134" y="360" font-size="58" font-weight="700" letter-spacing="-2" fill="#ffffff" text-anchor="start">Understanding</text>
<text x="134" y="424" font-size="58" font-weight="700" letter-spacing="-2" fill="#ffffff" text-anchor="start">foster care</text>
<circle cx="754" cy="524" r="34" fill="#fdb414"/>
<path d="M744 506 L744 542 L776 524 Z" fill="#063042"/>
</g>
<g filter="url(#castsm)">
<rect x="874" y="170" width="740" height="430" rx="6" fill="#041f2c"/>
<circle cx="1466.0" cy="316.20000000000005" r="118" fill="#fdb414" opacity="0.20"/>
<text x="918" y="242" font-size="17" font-weight="400" letter-spacing="5.1" fill="#fdb414" text-anchor="start" font-family="Space Mono, ui-monospace, SFMono-Regular, Menlo, monospace">PART 02</text>
<text x="918" y="360" font-size="58" font-weight="700" letter-spacing="-2" fill="#ffffff" text-anchor="start">Belief into</text>
<text x="918" y="424" font-size="58" font-weight="700" letter-spacing="-2" fill="#ffffff" text-anchor="start">action</text>
<circle cx="1538" cy="524" r="34" fill="#fdb414"/>
<path d="M1528 506 L1528 542 L1560 524 Z" fill="#063042"/>
</g>
<g filter="url(#castsm)">
<rect x="90" y="644" width="740" height="430" rx="6" fill="#041f2c"/>
<circle cx="682.0" cy="790.2" r="118" fill="#d1c7bb" opacity="0.20"/>
<text x="134" y="716" font-size="17" font-weight="400" letter-spacing="5.1" fill="#fdb414" text-anchor="start" font-family="Space Mono, ui-monospace, SFMono-Regular, Menlo, monospace">PART 03</text>
<text x="134" y="834" font-size="58" font-weight="700" letter-spacing="-2" fill="#ffffff" text-anchor="start">Just</text>
<text x="134" y="898" font-size="58" font-weight="700" letter-spacing="-2" fill="#ffffff" text-anchor="start">neighbors</text>
<circle cx="754" cy="998" r="34" fill="#fdb414"/>
<path d="M744 980 L744 1016 L776 998 Z" fill="#063042"/>
</g>
<g filter="url(#castsm)">
<rect x="874" y="644" width="740" height="430" rx="6" fill="#041f2c"/>
<circle cx="1466.0" cy="790.2" r="118" fill="#cae4db" opacity="0.20"/>
<text x="918" y="716" font-size="17" font-weight="400" letter-spacing="5.1" fill="#fdb414" text-anchor="start" font-family="Space Mono, ui-monospace, SFMono-Regular, Menlo, monospace">PART 04</text>
<text x="918" y="834" font-size="58" font-weight="700" letter-spacing="-2" fill="#ffffff" text-anchor="start">Your</text>
<text x="918" y="898" font-size="58" font-weight="700" letter-spacing="-2" fill="#ffffff" text-anchor="start">next step</text>
<circle cx="1538" cy="998" r="34" fill="#fdb414"/>
<path d="M1528 980 L1528 1016 L1560 998 Z" fill="#063042"/>
</g>
</svg>
