<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="cast" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000000" flood-opacity="0.30"/>
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <filter id="castsm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <linearGradient id="gutter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="42%" stop-color="#000" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#000" stop-opacity="0.26"/>
      <stop offset="58%" stop-color="#000" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
<rect width="1200" height="1200" fill="#0a0909"/>

  <g opacity="1.0">
    <clipPath id="cg5"><rect x="278.00" y="466.00" width="644.00" height="168.00"/></clipPath>
    <clipPath id="cm5"><rect x="516.00" y="228.00" width="168.00" height="644.00"/></clipPath>
    <clipPath id="cc5"><rect x="516.00" y="466.00" width="168.00" height="168.00"/></clipPath>
    <rect x="278.00" y="466.00" width="644.00" height="168.00" fill="#fdb414"/>
    <rect x="516.00" y="228.00" width="168.00" height="644.00" fill="#cae4db"/>
    <rect x="516.00" y="466.00" width="168.00" height="168.00" fill="#c8a111"/>
    <rect x="278.00" y="466.00" width="644.00" height="168.00" transform="rotate(-45 600.00 550.00)" fill="#d1c7bb"/>
    <g clip-path="url(#cg5)"><rect x="278.00" y="466.00" width="644.00" height="168.00" transform="rotate(-45 600.00 550.00)" fill="#b28d35"/></g>
    <g clip-path="url(#cm5)"><rect x="278.00" y="466.00" width="644.00" height="168.00" transform="rotate(-45 600.00 550.00)" fill="#aab9a8"/></g>
    <g clip-path="url(#cc5)"><rect x="278.00" y="466.00" width="644.00" height="168.00" transform="rotate(-45 600.00 550.00)" fill="#a47e0c"/></g>
  </g>
<text x="80" y="1104" font-size="20" font-weight="400" letter-spacing="6.0" fill="#ffffff" text-anchor="start" font-family="Space Mono, ui-monospace, SFMono-Regular, Menlo, monospace">THE FORGOTTEN INITIATIVE</text>
<text x="80" y="1146" font-size="18" font-weight="400" letter-spacing="5.3999999999999995" fill="rgba(255,255,255,0.42)" text-anchor="start" font-family="Space Mono, ui-monospace, SFMono-Regular, Menlo, monospace">IDENTITY MARK</text>
</svg>
