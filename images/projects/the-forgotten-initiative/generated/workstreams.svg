<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 1250" width="1250" height="1250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="cast" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000000" flood-opacity="0.30"/>
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <filter id="castsm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <linearGradient id="gutter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="42%" stop-color="#000" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#000" stop-opacity="0.26"/>
      <stop offset="58%" stop-color="#000" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
<rect width="1250" height="1250" fill="#9a513e"/>
<text x="80" y="120" font-size="18" font-weight="400" letter-spacing="5.3999999999999995" fill="rgba(255,255,255,0.6)" text-anchor="start" font-family="Space Mono, ui-monospace, SFMono-Regular, Menlo, monospace">COMMUNICATIONS SYSTEM</text>
<line x1="80" y1="226" x2="1170" y2="226" stroke="#ffffff" stroke-opacity="0.22"/>
<text x="80" y="292" font-size="40" font-weight="700" letter-spacing="0" fill="#fdb414" text-anchor="start">01</text>
<text x="196" y="292" font-size="42" font-weight="600" letter-spacing="-1.2" fill="#ffffff" text-anchor="start">Strategy + campaigns</text>
<line x1="80" y1="358" x2="1170" y2="358" stroke="#ffffff" stroke-opacity="0.22"/>
<text x="80" y="424" font-size="40" font-weight="700" letter-spacing="0" fill="#fdb414" text-anchor="start">02</text>
<text x="196" y="424" font-size="42" font-weight="600" letter-spacing="-1.2" fill="#ffffff" text-anchor="start">Podcast + long-form</text>
<line x1="80" y1="490" x2="1170" y2="490" stroke="#ffffff" stroke-opacity="0.22"/>
<text x="80" y="556" font-size="40" font-weight="700" letter-spacing="0" fill="#fdb414" text-anchor="start">03</text>
<text x="196" y="556" font-size="42" font-weight="600" letter-spacing="-1.2" fill="#ffffff" text-anchor="start">Video + field storytelling</text>
<line x1="80" y1="622" x2="1170" y2="622" stroke="#ffffff" stroke-opacity="0.22"/>
<text x="80" y="688" font-size="40" font-weight="700" letter-spacing="0" fill="#fdb414" text-anchor="start">04</text>
<text x="196" y="688" font-size="42" font-weight="600" letter-spacing="-1.2" fill="#ffffff" text-anchor="start">Launches + activation</text>
<line x1="80" y1="754" x2="1170" y2="754" stroke="#ffffff" stroke-opacity="0.22"/>
<text x="80" y="820" font-size="40" font-weight="700" letter-spacing="0" fill="#fdb414" text-anchor="start">05</text>
<text x="196" y="820" font-size="42" font-weight="600" letter-spacing="-1.2" fill="#ffffff" text-anchor="start">Fundraising + leadership</text>
<line x1="80" y1="886" x2="1170" y2="886" stroke="#ffffff" stroke-opacity="0.22"/>
<text x="80" y="982" font-size="32" font-weight="400" letter-spacing="0" fill="rgba(255,255,255,0.78)" text-anchor="start">Direct reports, contractors, briefs,</text>
<text x="80" y="1028" font-size="32" font-weight="400" letter-spacing="0" fill="rgba(255,255,255,0.78)" text-anchor="start">creative review, and deadlines.</text>

  <g opacity="1.0">
    <clipPath id="cg14"><rect x="987.20" y="1048.40" width="165.60" height="43.20"/></clipPath>
    <clipPath id="cm14"><rect x="1048.40" y="987.20" width="43.20" height="165.60"/></clipPath>
    <clipPath id="cc14"><rect x="1048.40" y="1048.40" width="43.20" height="43.20"/></clipPath>
    <rect x="987.20" y="1048.40" width="165.60" height="43.20" fill="#fdb414"/>
    <rect x="1048.40" y="987.20" width="43.20" height="165.60" fill="#cae4db"/>
    <rect x="1048.40" y="1048.40" width="43.20" height="43.20" fill="#c8a111"/>
