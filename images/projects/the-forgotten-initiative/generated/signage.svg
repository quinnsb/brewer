<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1150" width="1900" height="1150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="cast" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000000" flood-opacity="0.30"/>
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <filter id="castsm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <linearGradient id="gutter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="42%" stop-color="#000" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#000" stop-opacity="0.26"/>
      <stop offset="58%" stop-color="#000" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
<rect width="1900" height="1150" fill="#8d9a91"/>
<rect x="0" y="0" width="1900" height="897.0" fill="#9aa79d"/>
<rect x="0" y="897.0" width="1900" height="253.0" fill="#6f7c74"/>
<g filter="url(#cast)">
<rect x="250" y="90" width="460" height="830" fill="#063042"/>

  <g opacity="1.0">
    <clipPath id="cg15"><rect x="378.80" y="283.60" width="202.40" height="52.80"/></clipPath>
    <clipPath id="cm15"><rect x="453.60" y="208.80" width="52.80" height="202.40"/></clipPath>
    <clipPath id="cc15"><rect x="453.60" y="283.60" width="52.80" height="52.80"/></clipPath>
    <rect x="378.80" y="283.60" width="202.40" height="52.80" fill="#fdb414"/>
    <rect x="453.60" y="208.80" width="52.80" height="202.40" fill="#cae4db"/>
    <rect x="453.60" y="283.60" width="52.80" height="52.80" fill="#c8a111"/>
    <rect x="378.80" y="283.60" width="202.40" height="52.80" transform="rotate(-45 480.00 310.00)" fill="#d1c7bb"/>
    <g clip-path="url(#cg15)"><rect x="378.80" y="283.60" width="202.40" height="52.80" transform="rotate(-45 480.00 310.00)" fill="#b28d35"/></g>
    <g clip-path="url(#cm15)"><rect x="378.80" y="283.60" width="202.40" height="52.80" transform="rotate(-45 480.00 310.00)" fill="#aab9a8"/></g>
    <g clip-path="url(#cc15)"><rect x="378.80" y="283.60" width="202.40" height="52.80" transform="rotate(-45 480.00 310.00)" fill="#a47e0c"/></g>
  </g>
<text x="480" y="560" font-size="52" font-weight="700" letter-spacing="-1.6" fill="#ffffff" text-anchor="middle">Foster Care</text>
<text x="480" y="620" font-size="52" font-weight="700" letter-spacing="-1.6" fill="#ffffff" text-anchor="middle">&amp; The Church</text>
<rect x="430.0" y="660" width="100" height="5" fill="#fdb414"/>
<text x="480" y="750" font-size="34" font-weight="400" letter-spacing="0" fill="#cae4db" text-anchor="middle">Starts Sunday</text>
</g>
<g filter="url(#cast)">
<rect x="830" y="300" width="880" height="400" rx="5" fill="#fdb414"/>
<text x="886" y="450" font-size="92" font-weight="700" letter-spacing="-3.5" fill="#063042" text-anchor="start">Awareness</text>
<text x="886" y="548" font-size="92" font-weight="700" letter-spacing="-3.5" fill="#063042" text-anchor="start">leads</text>
<text x="886" y="646" font-size="92" font-weight="700" letter-spacing="-3.5" fill="#063042" text-anchor="start">somewhere.</text>

  <g opacity="1.0">
    <clipPath id="cg16"><rect x="1564.00" y="588.00" width="92.00" height="24.00"/></clipPath>
    <clipPath id="cm16"><rect x="1598.00" y="554.00" width="24.00" height="92.00"/></clipPath>
    <clipPath id="cc16"><rect x="1598.00" y="588.00" width="24.00" height="24.00"/></clipPath>
    <rect x="1564.00" y="588.00" width="92.00" height="24.00" fill="#fdb414"/>
    <rect x="1598.00" y="554.00" width="24.00" height="92.00" fill="#cae4db"/>
    <rect x="1598.00" y="588.00" width="24.00" height="24.00" fill="#c8a111"/>
    <rect x="1564.00" y="588.00" width="92.00" height="24.00" transform="rotate(-45 1610.00 600.00)" fill="#d1c7bb"/>
    <g clip-path="url(#cg16)"><rect x="1564.00" y="588.00" width="92.00" height="24.00" transform="rotate(-45 1610.00 600.00)" fill="#b28d35"/></g>
    <g clip-path="url(#cm16)"><rect x="1564.00" y="588.00" width="92.00" height="24.00" transform="rotate(-45 1610.00 600.00)" fill="#aab9a8"/></g>
    <g clip-path="url(#cc16)"><rect x="1564.00" y="588.00" width="92.00" height="24.00" transform="rotate(-45 1610.00 600.00)" fill="#a47e0c"/></g>
  </g>
</g>
<text x="250" y="1090" font-size="18" font-weight="400" letter-spacing="5.3999999999999995" fill="rgba(255,255,255,0.75)" text-anchor="start" font-family="Space Mono, ui-monospace, SFMono-Regular, Menlo, monospace">ENVIRONMENTAL   /   CHURCH SIGNAGE</text>
</svg>
