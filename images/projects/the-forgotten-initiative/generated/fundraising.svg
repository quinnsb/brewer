<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 1250" width="1250" height="1250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="cast" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000000" flood-opacity="0.30"/>
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <filter id="castsm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <linearGradient id="gutter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="42%" stop-color="#000" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#000" stop-opacity="0.26"/>
      <stop offset="58%" stop-color="#000" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
<rect width="1250" height="1250" fill="#f1ece2"/>
<circle cx="1025.0" cy="1050.0" r="300" fill="#fdb414" opacity="0.45"/>
<text x="80" y="128" font-size="18" font-weight="400" letter-spacing="5.3999999999999995" fill="#b28d35" text-anchor="start" font-family="Space Mono, ui-monospace, SFMono-Regular, Menlo, monospace">YEAR-END   +   GIVING TUESDAY</text>
<text x="80" y="350" font-size="142" font-weight="700" letter-spacing="-6" fill="#063042" text-anchor="start">Give so</text>
<text x="80" y="508" font-size="142" font-weight="700" letter-spacing="-6" fill="#063042" text-anchor="start">no one is</text>
<text x="80" y="666" font-size="142" font-weight="700" letter-spacing="-6" fill="#b28d35" text-anchor="start">forgotten.</text>
<rect x="80" y="820" width="300" height="8" fill="#063042" opacity="0.3"/>
<text x="80" y="930" font-size="32" font-weight="400" letter-spacing="0" fill="#063042" text-anchor="start" opacity="0.65">Donor email, social, launch film, event, and the</text>
<text x="80" y="976" font-size="32" font-weight="400" letter-spacing="0" fill="#063042" text-anchor="start" opacity="0.65">recurring ask - run as one system.</text>

  <g opacity="1.0">
    <clipPath id="cg13"><rect x="85.20" y="1099.40" width="119.60" height="31.20"/></clipPath>
    <clipPath id="cm13"><rect x="129.40" y="1055.20" width="31.20" height="119.60"/></clipPath>
    <clipPath id="cc13"><rect x="129.40" y="1099.40" width="31.20" height="31.20"/></clipPath>
    <rect x="85.20" y="1099.40" width="119.60" height="31.20" fill="#fdb414"/>
    <rect x="129.40" y="1055.20" width="31.20" height="119.60" fill="#cae4db"/>
    <rect x="129.40" y="1099.40" width="31.20" height="31.20" fill="#c8a111"/>
    <rect x="85.20" y="1099.40" width="119.60" height="31.20" transform="rotate(-45 145.00 1115.00)" fill="#d1c7bb"/>
    <g clip-path="url(#cg13)"><rect x="85.20" y="1099.40" width="119.60" height="31.20" transform="rotate(-45 145.00 1115.00)" fill="#b28d35"/></g>
    <g clip-path="url(#cm13)"><rect x="85.20" y="1099.40" width="119.60" height="31.20" transform="rotate(-45 145.00 1115.00)" fill="#aab9a8"/></g>
    <g clip-path="url(#cc13)"><rect x="85.20" y="1099.40" width="119.60" height="31.20" transform="rotate(-45 145.00 1115.00)" fill="#a47e0c"/></g>
  </g>
<rect width="1250" height="1250" filter="url(#grain)" fill="none"/>
</svg>
