<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 1300" width="2100" height="1300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="cast" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000000" flood-opacity="0.30"/>
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <filter id="castsm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <linearGradient id="gutter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="42%" stop-color="#000" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#000" stop-opacity="0.26"/>
      <stop offset="58%" stop-color="#000" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
<rect width="2100" height="1300" fill="#f1ece2"/>
<text x="90" y="108" font-size="19" font-weight="400" letter-spacing="5.7" fill="#063042" text-anchor="start" font-family="Space Mono, ui-monospace, SFMono-Regular, Menlo, monospace">CAMPAIGN TYPOGRAPHY</text>
<line x1="90" y1="146" x2="2010" y2="146" stroke="#063042" stroke-opacity="0.14"/>
<text x="70" y="560" font-size="440" font-weight="700" letter-spacing="-22" fill="#063042" text-anchor="start">Aa</text>
<text x="700" y="300" font-size="96" font-weight="700" letter-spacing="-2" fill="#063042" text-anchor="start">ABCDEFGHIJKLM</text>
<text x="700" y="410" font-size="96" font-weight="700" letter-spacing="-2" fill="#063042" text-anchor="start">NOPQRSTUVWXYZ</text>
<text x="700" y="520" font-size="96" font-weight="400" letter-spacing="-2" fill="#b28d35" text-anchor="start">abcdefghijklmnopqrstuvwxyz</text>
<text x="700" y="630" font-size="96" font-weight="400" letter-spacing="-2" fill="#063042" text-anchor="start" opacity="0.45">0123456789 &amp; ? !</text>
<line x1="90" y1="700" x2="2010" y2="700" stroke="#063042" stroke-opacity="0.14"/>
<text x="90" y="810" font-size="104" font-weight="700" letter-spacing="-1.5" fill="#063042" text-anchor="start">Awareness had to lead somewhere.</text>
<text x="90" y="976" font-size="64" font-weight="600" letter-spacing="-1.5" fill="#063042" text-anchor="start">Make people feel seen, help them understand.</text>
<text x="90" y="1102" font-size="38" font-weight="400" letter-spacing="-1.5" fill="#063042" text-anchor="start">A moving story could create attention, but the communication still needed to guide action.</text>
<rect width="2100" height="1300" filter="url(#grain)" fill="none"/>
</svg>
