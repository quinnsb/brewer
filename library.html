<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Library</title>
  <meta name="description" content="Books, records, films, and podcasts worth keeping." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/library.css" />
</head>
<body class="library">
  <section id="hero" class="hero" aria-labelledby="hero-heading">
    <div class="hero-track">
      <div class="hero-sticky">
        <div class="hero-inner">
          <h1 id="hero-heading" class="hero-line">
            <span class="stem">You are what you</span>
            <span class="slot" id="verb-slot"></span>
          </h1>
        </div>
        <div class="hero-stage" id="hero-stage" aria-hidden="true"></div>
      </div>
    </div>
  </section>

  <main id="shelves" class="shelves"></main>

  <footer class="lib-foot">
    <p>Twenty-eight things worth keeping. Cover art from Open Library, iTunes, and Wikipedia.</p>
  </footer>

  <script type="module" src="js/library.js"></script>
</body>
</html>
